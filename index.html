<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;min-height:100vh;position:relative;overflow-x:hidden}

#bg i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;will-change:transform}
#bg i:nth-child(1){width:290px;height:290px;background:var(--b1);top:-70px;left:-80px;animation:fl1 16s ease-in-out infinite alternate}
#bg i:nth-child(2){width:260px;height:260px;background:var(--b2);top:34%;right:-90px;animation:fl2 19s ease-in-out infinite alternate}
#bg i:nth-child(3){width:300px;height:300px;background:var(--b3);bottom:-90px;left:12%;animation:fl3 22s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(90px,120px) scale(1.15)}}
@keyframes fl2{to{transform:translate(-110px,-90px) scale(.9)}}
@keyframes fl3{to{transform:translate(120px,-100px) scale(1.2)}}
#app,.nav{position:relative;z-index:1}
.card,.chip,.pill{backdrop-filter:blur(6px)}
.card{background:color-mix(in srgb,var(--card) 88%,transparent)}
#app.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
#app.enter .grid3>*{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
#app.enter .grid3>*:nth-child(2){animation-delay:.04s}#app.enter .grid3>*:nth-child(3){animation-delay:.08s}#app.enter .grid3>*:nth-child(4){animation-delay:.12s}#app.enter .grid3>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.btn{transition:transform .12s,filter .2s}.btn:active{transform:scale(.97)}
.chip{transition:background .2s,color .2s,transform .12s}.chip:active{transform:scale(.94)}

@keyframes shine{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
.nav button.on span{display:inline-block;animation:bounce .5s}
@keyframes bounce{40%{transform:translateY(-6px) scale(1.2)}}

'use strict';
/* ───────── Données de base ───────── */

 {n:'Noir',hex:'#1c1c1c',neutral:1},{n:'Blanc',hex:'#f4f4ee',neutral:1},{n:'Gris',hex:'#8d8d8d',neutral:1},
 {n:'Beige',hex:'#d8c3a0',neutral:1},{n:'Marine',hex:'#1f2d4d',neutral:1},{n:'Marron',hex:'#6b4a32',neutral:1},
 {n:'Kaki',hex:'#6b6f3a',neutral:1},{n:'Bleu jean',hex:'#4a6fa5',neutral:1},{n:'Bleu',hex:'#2f6fdb'},
 {n:'Rouge',hex:'#c62d2d'},{n:'Bordeaux',hex:'#7a1f2b'},{n:'Vert',hex:'#2e8b57'},{n:'Jaune',hex:'#e6c229'},
 {n:'Orange',hex:'#e67e22'},{n:'Rose',hex:'#e58fb0'},{n:'Violet',hex:'#7b4fb3'}];

const WARM=[[1,'Léger'],[2,'Moyen'],[3,'Chaud']];
const FORM=[[0,'Sport'],[1,'Décontracté'],[2,'Smart'],[3,'Habillé']];
const PROFILS=[['homme','Homme'],['femme','Femme'],['tous','Tous']];
const OCC=[['quotidien','Quotidien'],['ecole','École'],['travail','Travail'],['amis','Sortie amis'],['soiree','Soirée'],['sport','Sport']];
const OCC_AUTO={0:['sport','quotidien'],1:['quotidien','ecole','amis'],2:['ecole','travail','amis','soiree'],3:['travail','soiree']};
const occOf=i=>(Array.isArray(i.occ)&&i.occ.length)?i.occ:(OCC_AUTO[i.form]||['quotidien']);
/* g : t=tous, h=homme, f=femme · w=chaleur · f=style · m=ports avant lavage · no=modes météo où on ne le propose pas */
const TYPES={
 haut:[{k:'tshirt',l:'T-shirt',g:'t',w:1,f:1,m:1},{k:'chemise',l:'Chemise',g:'t',w:2,f:2,m:2},{k:'polo',l:'Polo',g:'t',w:1,f:2,m:1},{k:'pull',l:'Pull',g:'t',w:3,f:1,m:4},{k:'sweat',l:'Sweat / Hoodie',g:'t',w:3,f:0,m:3},{k:'debardeur',l:'Débardeur',g:'t',w:1,f:1,m:1,no:['frais','froid']},{k:'blouse',l:'Blouse',g:'f',w:2,f:2,m:2,wg:'Délicats',wt:'30°'},{k:'top',l:'Top',g:'f',w:1,f:1,m:1}],
 bas:[{k:'jean',l:'Jean',g:'t',w:2,f:1,m:5},{k:'pantalon',l:'Pantalon (chino, tissu)',g:'t',w:2,f:2,m:4},{k:'pcostume',l:'Pantalon de costume',g:'t',w:2,f:3,m:4,wg:'Délicats',wt:'30°'},{k:'jogging',l:'Jogging',g:'t',w:2,f:0,m:3},{k:'short',l:'Short',g:'t',w:1,f:1,m:3,no:['frais','froid']},{k:'jupe',l:'Jupe',g:'f',w:2,f:2,m:3,wg:'Délicats',wt:'30°'},{k:'legging',l:'Legging',g:'f',w:2,f:0,m:2}],
 veste:[{k:'blouson',l:'Blouson',g:'t',w:2,f:1,m:10},{k:'blazer',l:'Blazer / veste de costume',g:'t',w:2,f:3,m:8},{k:'manteau',l:'Manteau',g:'t',w:3,f:2,m:12},{k:'doudoune',l:'Doudoune',g:'t',w:3,f:1,m:12},{k:'gilet',l:'Gilet',g:'t',w:2,f:1,m:6,wg:'Délicats',wt:'30°'}],
 acc:[{k:'montre',l:'Montre',g:'t',w:2,f:2,m:999,slot:'montre',metal:1},{k:'vue',l:'Lunettes de vue',g:'t',w:2,f:2,m:999,slot:'vue',opt:1},{k:'casquette',l:'Casquette',g:'t',w:1,f:1,m:999,slot:'chapeau'},{k:'bonnet',l:'Bonnet',g:'t',w:3,f:1,m:999,slot:'chapeau',only:['frais','froid']},{k:'chapeau',l:'Chapeau',g:'t',w:2,f:2,m:999,slot:'chapeau'},{k:'lunettes',l:'Lunettes de soleil',g:'t',w:1,f:1,m:999,slot:'lunettes',only:['chaud','doux']},{k:'echarpe',l:'Écharpe / foulard',g:'t',w:3,f:1,m:999,slot:'echarpe',only:['frais','froid']},{k:'ceinture',l:'Ceinture',g:'t',w:2,f:2,m:999,slot:'ceinture'},{k:'cravate',l:'Cravate',g:'h',w:2,f:3,m:999,slot:'cravate'},{k:'noeud',l:'Nœud papillon',g:'h',w:2,f:3,m:999,slot:'cravate'},{k:'sac',l:'Sac',g:'t',w:2,f:1,m:999,slot:'sac'},{k:'collier',l:'Collier',g:'t',w:2,f:2,m:999,slot:'collier',metal:1},{k:'boucles',l:'Boucles d’oreilles',g:'f',w:2,f:2,m:999,slot:'boucles',metal:1},{k:'bracelet',l:'Bracelet',g:'t',w:2,f:1,m:999,slot:'bracelet',metal:1},{k:'bague',l:'Bague',g:'t',w:2,f:2,m:999,slot:'bague',metal:1}],
 robe:[{k:'robe',l:'Robe',g:'f',w:2,f:2,m:2,wg:'Délicats',wt:'30°'},{k:'robelegere',l:'Robe légère (été)',g:'f',w:1,f:1,m:2,wg:'Délicats',wt:'30°'},{k:'robesoiree',l:'Robe de soirée',g:'f',w:2,f:3,m:2,wg:'Délicats',wt:'30°'},{k:'combi',l:'Combinaison',g:'f',w:2,f:2,m:2,wg:'Délicats',wt:'30°'},{k:'salopette',l:'Salopette',g:'t',w:2,f:1,m:3}],
 chaussures:[{k:'baskets',l:'Baskets',g:'t',w:2,f:1,m:30},{k:'sport',l:'Chaussures de sport',g:'t',w:2,f:0,m:30},{k:'ville',l:'Chaussures de ville',g:'t',w:2,f:3,m:40},{k:'mocassins',l:'Mocassins',g:'t',w:2,f:2,m:40},{k:'bottines',l:'Bottines / bottes',g:'t',w:3,f:2,m:40},{k:'sandales',l:'Sandales',g:'t',w:1,f:1,m:30,no:['frais','froid']},{k:'escarpins',l:'Escarpins / talons',g:'f',w:2,f:3,m:40},{k:'ballerines',l:'Ballerines',g:'f',w:1,f:2,m:30}]
};
const typeInfo=i=>i&&i.type?((TYPES[i.cat]||[]).find(t=>t.k===i.type)||null):null;
const WASHG=['Blancs','Foncés','Couleurs','Délicats','Nettoyage spécial'];
const TEMPS=['30°','40°','60°','À la main'];
const CONDS=[['bon','Bon état'],['abime','Abîmé'],['use','Usé']];
const MODES={chaud:'Chaud',doux:'Doux',frais:'Frais',froid:'Froid'};
const WARM_RULES={chaud:{haut:[1,1],bas:[1,2],veste:[1,1]},doux:{haut:[1,2],bas:[1,3],veste:[1,3]},frais:{haut:[1,3],bas:[1,3],veste:[2,3]},froid:{haut:[2,3],bas:[2,3],veste:[3,3]}};
const DEFAULT_SETTINGS={maxByCat:{haut:1,bas:4,veste:10,chaussures:30,robe:2,acc:999},lowTops:3,weatherOverride:'auto',lat:48.8566,lon:2.3522,place:'Paris',lastExport:null,lastCreate:{cat:'haut',warm:2,form:1},profil:null,weatherCache:null};

/* ───────── IndexedDB ───────── */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('akanjo',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('log',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dbAll=s=>rq(st(s).getAll());
const dbPut=(s,o)=>rq(st(s,'readwrite').put(o));
const dbDel=(s,k)=>rq(st(s,'readwrite').delete(k));
const dbClear=s=>rq(st(s,'readwrite').clear());
const saveSettings=()=>dbPut('meta',{key:'settings',value:S.settings});

/* ───────── État ───────── */
const S={accOff:new Set(),items:[],log:[],settings:null,tab:'today',fCat:'all',fSt:'all',weather:null,page:0,seed:0,useJacket:null,occ:'all',proposals:[],note:'',dirty:true};
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtDate=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const daysSince=d=>d?Math.round((new Date(todayStr()+'T12:00')-new Date(d+'T12:00'))/864e5):30;

const urlCache=new Map();
function blobURL(id,blob){if(!blob)return null;const c=urlCache.get(id);if(c&&c.blob===blob)return c.url;if(c)URL.revokeObjectURL(c.url);const url=URL.createObjectURL(blob);urlCache.set(id,{blob,url});return url}
async function fileToBlob(file,max=900){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  }finally{URL.revokeObjectURL(url)}
}
async function rotateBlob(b){
  const url=URL.createObjectURL(b);
  try{const img=new Image();img.src=url;await img.decode();
    const c=document.createElement('canvas');c.width=img.naturalHeight;c.height=img.naturalWidth;
    const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(img,0,0);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  }finally{URL.revokeObjectURL(url)}
}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(h.match(/:(.*?);/)||[,'image/jpeg'])[1];const bin=atob(d);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}

const lifePct=i=>i.status!=='propre'?0:Math.max(0,Math.min(1,(i.maxWears-i.wears)/i.maxWears));
const barColor=p=>p>.5?'var(--ok)':p>.25?'var(--warn)':'var(--bad)';
const statusLabel=i=>i.cat==='acc'&&i.condition==='bon'?'Accessoire':i.condition==='abime'?'Abîmé':i.condition==='use'?'Usé':i.status==='sale'?(i.cat==='chaussures'||i.cat==='veste'?'À nettoyer':'Sale'):i.status==='lavage'?'En lavage':`${Math.max(0,i.maxWears-i.wears)} port${i.maxWears-i.wears>1?'s':''} restant${i.maxWears-i.wears>1?'s':''}`;
function defaultWash(cat,color){
  if(cat==='chaussures'||cat==='veste')return ['Nettoyage spécial','À la main'];
  if(cat==='robe')return ['Délicats','30°'];
  if(cat==='acc')return ['Délicats','À la main'];

const modeFromTemp=t=>t>=24?'chaud':t>=16?'doux':t>=8?'frais':'froid';
function currentMode(){const o=S.settings.weatherOverride;if(o!=='auto')return o;return S.weather?modeFromTemp(S.weather.feel):'doux'}
async function loadWeather(force){
  const c=S.settings.weatherCache;
  if(!force&&c&&c.date===todayStr()&&Date.now()-c.ts<3*3600e3){S.weather=c;return}
  try{
    const {lat,lon}=S.settings;
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),6000);
    let r;try{r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`,{signal:ac.signal})}finally{clearTimeout(to)}
    if(!r.ok)throw 0;
    const j=await r.json();const mx=j.daily.temperature_2m_max[0],mn=j.daily.temperature_2m_min[0];
    if(!Number.isFinite(mx)||!Number.isFinite(mn))throw 0;
    S.weather={date:todayStr(),ts:Date.now(),max:mx,min:mn,rain:j.daily.precipitation_probability_max[0],feel:mx*.6+mn*.4};
    S.settings.weatherCache=S.weather;saveSettings();
  }catch(e){S.weather=c||null}
}

/* ───────── Moteur de combinaisons (règles pures, sans IA) ───────── */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function suggestAcc(o,mode,rnd){
  if(S.settings.accOn===false)return [];
  const main=[o.t,o.b,o.s,o.j].filter(Boolean),forms=main.map(i=>i.form),mn=Math.min(...forms),mx=Math.max(...forms);
  const vivid=new Set(main.filter(i=>!colorInfo(i.color).neutral).map(i=>i.color));
  const isRobe=o.t&&o.t.cat==='robe';
  const hasShirt=!isRobe&&o.t&&(o.t.type==='chemise'||(!o.t.type&&o.t.form>=2));
  const pants=o.b&&!['legging','jogging','jupe'].includes(o.b.type);
  const pool=S.items.filter(i=>i.cat==='acc'&&avail(i)&&(S.occ==='all'||occOf(i).includes(S.occ)));
  const bySlot=new Map();for(const i of pool){const t=typeInfo(i);if(!t)continue;const al=i.meteo&&i.meteo.length?i.meteo:(t.only||null);if(al&&!al.includes(mode))continue;(bySlot.get(t.slot)||bySlot.set(t.slot,[]).get(t.slot)).push(i)}
  const order=['montre','vue','bracelet','collier','boucles','bague','ceinture','cravate','chapeau','lunettes','echarpe','sac'];
  const out=[];let metal=null;
  for(const slot of order){
    let c=bySlot.get(slot);if(!c)continue;
    c=c.filter(i=>{
      if(Math.max(mx,i.form)-Math.min(mn,i.form)>1)return false;
      const v=new Set(vivid);if(!colorInfo(i.color).neutral)v.add(i.color);if(v.size>1)return false;
      if(slot==='cravate'&&!(hasShirt&&mx>=2&&!isRobe))return false;
      if(slot==='ceinture'){if(!pants||isRobe)return false;const sc=o.s&&o.s.color;if(sc&&(sc==='Noir'||sc==='Marron')&&i.color!==sc&&i.color!=='Noir'&&i.color!=='Marron')return false;if(sc&&(sc==='Noir'||sc==='Marron')&&i.color!==sc)return false}
      if(slot==='chapeau'&&mx>=3)return false;
      if(i.metal==='or'||i.metal==='argent'){if(metal&&i.metal!==metal)return false}
      return true});
    if(!c.length)continue;
    if(slot==='vue'&&rnd()>(mx>=2?0.65:0.4))continue;
    if(slot==='lunettes'&&out.some(x=>typeInfo(x).slot==='vue'))continue;
    const pick=c.map(i=>({i,k:daysSince(i.lastWorn)+rnd()*3})).sort((a,b)=>b.k-a.k)[0].i;
    if(pick.metal==='or'||pick.metal==='argent')metal=metal||pick.metal;
    out.push(pick);
  }
  return out;
}
function computeProposals(){
  const mode=currentMode(),R=WARM_RULES[mode];
  const useJ=S.useJacket===null?(mode==='frais'||mode==='froid'):S.useJacket;
  const rnd=mulberry(hashStr(todayStr())+S.seed*977);
  const recent=S.log.filter(e=>daysSince(e.date)<=7);
  const recentKeys=new Set(recent.map(e=>[...e.items.map(x=>x.id)].sort().join('|')));
  const recentPairs=new Set(S.log.filter(e=>daysSince(e.date)<=4).map(e=>{const its=e.items.map(x=>S.items.find(i=>i.id===x.id)).filter(Boolean);const t=its.find(i=>i.cat==='haut'),b=its.find(i=>i.cat==='bas');return t&&b?t.id+'|'+b.id:''}));
  const run=relax=>{
    const okT=i=>!((typeInfo(i)||{}).no||[]).includes(mode)&&(S.occ==='all'||occOf(i).includes(S.occ));
    const RR={...R,robe:[Math.max(R.haut[0],R.bas[0]),Math.min(R.haut[1],R.bas[1])]};
    const pick=cat=>S.items.filter(i=>i.cat===cat&&avail(i)&&okT(i)&&(relax||(RR[cat]&&i.warmth>=RR[cat][0]&&i.warmth<=RR[cat][1])));
    const cap=l=>{if(l.length<=22)return l;const k=l.map(i=>({i,k:daysSince(i.lastWorn)+rnd()*3})).sort((a,b)=>b.k-a.k).map(x=>x.i);const top=k.slice(0,22);return top.concat(k.slice(22).filter(i=>i.setId))};
    const mem=new Map();for(const i of S.items)if(i.setId){if(!mem.has(i.setId))mem.set(i.setId,[]);mem.get(i.setId).push(i)}
    const tops=cap(pick('haut')),bots=cap(pick('bas')),robes=cap(pick('robe'));
    const shoesAll=S.items.filter(i=>i.cat==='chaussures'&&avail(i));
    let shoes=cap(shoesAll.filter(okT));
    if(shoesAll.length&&!shoes.length)return [];
    let jk=useJ?cap(pick('veste')):[null];
    for(const x of S.items.filter(i=>i.cat==='veste'&&i.setId&&avail(i)&&okT(i)))if(!jk.includes(x))jk.push(x);
    if(!shoes.length)shoes=[null];
    if(!jk.length)jk=[null];
    const out=[];
    const consider=(t,b,r,s,j)=>{
      const top=r||t,bot=r?null:b;
      const pcs=[top,bot,s,j].filter(Boolean);
      if(pcs.some(p=>p.setId&&!(mem.get(p.setId)||[]).every(m=>pcs.includes(m))))return;
      const f=pcs.map(i=>i.form);if(Math.max(...f)-Math.min(...f)>1)return;
      const vivid=new Set(pcs.filter(i=>!colorInfo(i.color).neutral).map(i=>i.color));if(vivid.size>1)return;
      const key=pcs.map(i=>i.id).sort().join('|');if(recentKeys.has(key))return;
      const cols=new Set(pcs.map(i=>i.color));let sc=0;
      if(cols.has('Noir')&&cols.has('Marine'))sc-=3;
      if(cols.has('Marron')&&cols.has('Noir'))sc-=2;
      if(bot){
        if(top.color===bot.color)sc+=colorInfo(top.color).neutral?.5:1;
        const light=c=>c==='Blanc'||c==='Beige',dark=c=>['Noir','Marine','Bleu jean','Gris','Marron'].includes(c);
        if((light(top.color)&&dark(bot.color))||(dark(top.color)&&light(bot.color)))sc+=1;
        if(recentPairs.has(top.id+'|'+bot.id))sc-=3;
      }
      if(vivid.size===1)sc+=.5;
      for(const i of pcs){sc+=Math.min(daysSince(i.lastWorn),14)/14;if(i.wears>0)sc+=.4}
      sc+=rnd()*.8;
      out.push({t:top,b:bot,s,j,sc});
    };
    for(const t of tops)for(const b of bots)for(const s of shoes)for(const j of jk)consider(t,b,null,s,j);
    for(const r of robes)for(const s of shoes)for(const j of jk)consider(null,null,r,s,j);
    return out.sort((a,b)=>b.sc-a.sc);
  };
  let all=run(false),note='';
  const occNote=S.occ!=='all'?' pour « '+(OCC.find(o=>o[0]===S.occ)||[0,S.occ])[1]+' »':'';
  if(!all.length){all=run(true);if(all.length)note='Peu de choix pour cette météo'+occNote+' : j’ai assoupli la règle de chaleur.'}
  const sel=[],ut=new Map(),ub=new Map();
  for(const o of all){const bid=o.b?o.b.id:'-';if((ut.get(o.t.id)||0)>=2||(ub.get(bid)||0)>=3)continue;sel.push(o);ut.set(o.t.id,(ut.get(o.t.id)||0)+1);ub.set(bid,(ub.get(bid)||0)+1);if(sel.length>=24)break}
  for(const o of all){if(sel.length>=24)break;if(!sel.includes(o))sel.push(o)}
  // couverture : chaque vêtement disponible apparaît dans au moins une tenue valide (sans changer les règles)
  const used=new Set();for(const o of sel)for(const x of [o.t,o.b,o.s,o.j])x&&used.add(x.id);
  for(const o of all){if(sel.length>=24)break;const ids=[o.t,o.b,o.s,o.j].filter(Boolean).map(x=>x.id);if(ids.some(id=>!used.has(id))&&!sel.includes(o)){sel.push(o);ids.forEach(id=>used.add(id))}}
  if(useJ&&!S.items.some(i=>i.cat==='veste'&&avail(i)))note=(note?note+' ':'')+'Aucune veste disponible.';
  if(!S.items.some(i=>i.cat==='chaussures'&&avail(i)))note=(note?note+' ':'')+'Aucune chaussure disponible.';
  for(const o of sel)o.acc=suggestAcc(o,mode,rnd);
  S.accOff=new Set();
  S.proposals=sel;S.note=note;S.dirty=false;
}

/* ───────── Actions métier ───────── */
const todayEntry=()=>S.log.find(e=>e.date===todayStr());
async function validateOutfit(idx){
  if(todayEntry())return toast('Une tenue est déjà validée aujourd’hui');
  const o=S.proposals[idx];if(!o)return;
  const ids=[o.t,o.b,o.s,o.j].filter(Boolean).map(i=>i.id);
  const accIds=(o.acc||[]).filter(a=>!S.accOff.has(idx+':'+a.id)).map(a=>a.id);
  const entry={id:uid(),date:todayStr(),ts:Date.now(),items:[],photo:null};
  for(const id of ids.concat(accIds)){
    const it=S.items.find(i=>i.id===id);if(it.cat==='acc'){it.totalWears=(it.totalWears||0)+1;it.lastWorn=entry.date;entry.items.push({id,flipped:false});await dbPut('items',it);continue}
    it.wears++;it.totalWears=(it.totalWears||0)+1;it.lastWorn=entry.date;
    let flipped=false;if(it.wears>=it.maxWears&&it.status==='propre'){it.status='sale';flipped=true}
    entry.items.push({id,flipped});await dbPut('items',it);
  }
  S.log.push(entry);await dbPut('log',entry);S.dirty=true;render();toast('Tenue validée ✓');
}
async function undoToday(){
  const e=todayEntry();if(!e)return;
  for(const x of e.items){const it=S.items.find(i=>i.id===x.id);if(!it)continue;
    it.wears=Math.max(0,it.wears-1);it.totalWears=Math.max(0,(it.totalWears||1)-1);
    if(x.flipped&&it.status==='sale')it.status='propre';
    const prev=S.log.filter(l=>l.id!==e.id&&l.items.some(y=>y.id===it.id)).map(l=>l.date).sort().pop();it.lastWorn=prev||null;
    await dbPut('items',it)}
  S.log=S.log.filter(l=>l.id!==e.id);await dbDel('log',e.id);S.dirty=true;render();toast('Tenue annulée');
}
async function setStatus(id,status){
  const it=S.items.find(i=>i.id===id);if(!it)return;it.status=status;if(status==='propre')it.wears=0;
  await dbPut('items',it);S.dirty=true;render();
}
async function groupAction(key,to){
  const [g,t]=decodeURIComponent(key).split('|');
  const from=to==='lavage'?'sale':'lavage';
  const list=S.items.filter(i=>i.status===from&&i.washGroup===g&&i.washTemp===t);
  for(const it of list){it.status=to;if(to==='propre')it.wears=0;await dbPut('items',it)}
  S.dirty=true;render();toast(to==='lavage'?'Machine lancée':'Remis au propre ✓');
}

/* ───────── Rendu : briques ───────── */
function thumb(it,extra=''){
  const url=blobURL(it.id,it.photo),ci=colorInfo(it.color);
  return `<div class="thumb">${url?`<img src="${url}" alt="">`:`<span class="ph" style="background:${ci.hex}"><i>${CATS[it.cat].icon}</i></span>`}${extra}</div>`;
}
const bar=i=>{if(i.cat==='acc')return '';const p=lifePct(i);return `<div class="bar"><b style="width:${p*100}%;background:${barColor(p)}"></b></div>`};
function tile(it,act='editItem',showBadge=true){
  const b=showBadge&&!avail(it)?`<span class="badge">${esc(statusLabel(it))}</span>`:'';
  return `<button class="tile" style="border:0;background:none;padding:0;color:inherit;font:inherit" data-a="${act}" data-id="${it.id}">${thumb(it,b)}${bar(it)}<div class="nm">${esc(it.name)}</div></button>`;
}
const ORDER={veste:0,haut:1,robe:1,bas:2,chaussures:3,acc:4};
function stack(list,compact){
  const l=list.filter(Boolean).sort((a,b)=>ORDER[a.cat]-ORDER[b.cat]);
  return `<div class="stack ${compact?'compact':''}">${l.map(i=>`<div class="srow">${thumb(i)}<div class="meta"><div class="nm">${esc(i.name)}</div><div class="cat">${CATS[i.cat].label} · ${esc(statusLabel(i))}${i.setId&&S.settings.sets&&S.settings.sets[i.setId]?' · '+esc(S.settings.sets[i.setId]):''}</div>${compact?'':bar(i)}</div></div>`).join('')}</div>`;
}
function accChips(o,idx){
  if(!o.acc||!o.acc.length)return '';
  return `<div class="sub" style="margin:10px 0 4px">Accessoires (touche pour mettre ou non)</div><div class="chips">${o.acc.map(a=>{const t=typeInfo(a),on=!S.accOff.has(idx+':'+a.id);return `<span class="chip ${on?'on':''}" data-a="accTog" data-i="${idx}" data-id="${esc(a.id)}">${on?'✓ ':''}${esc(a.name)}</span>`}).join('')}</div>`;
}

 ['Veste en jean','veste','Bleu jean',2,1],['Manteau noir','veste','Noir',3,2]];
async function loadDemo(){
  for(const [name,cat,color,warmth,form] of DEMO){const [g,t]=defaultWash(cat,color);
    const o={id:uid(),name,cat,color,warmth,form,maxWears:S.settings.maxByCat[cat],wears:0,totalWears:0,washGroup:g,washTemp:t,status:'propre',condition:'bon',lastWorn:null,photo:null,createdAt:Date.now(),demo:true};
    await dbPut('items',o);S.items.push(o)}
  S.dirty=true;render();toast('16 exemples ajoutés');
}

/* ───────── Sauvegarde ───────── */
async function exportData(){
  const items=[];for(const i of S.items){items.push({...i,photo:i.photo?await blobToDataURL(i.photo):null})}
  const log=[];for(const l of S.log){log.push({...l,photo:l.photo?await blobToDataURL(l.photo):null})}
  const payload={app:'akanjo',version:1,exportedAt:new Date().toISOString(),settings:{...S.settings,weatherCache:null},items,log};
  const name=`akanjo-sauvegarde-${todayStr()}.json`;
  const file=new File([JSON.stringify(payload)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Akanjo'})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    S.settings.lastExport=Date.now();await saveSettings();render();toast('Sauvegarde créée ✓');
  }catch(e){if(e&&e.name!=='AbortError')toast('Export impossible')}
}
/* ───────── Vêtements ajoutés avec l'app (seed.json) : jamais d'écrasement, jamais de retour après suppression ───────── */
async function applySeed(){
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),8000);
    let r;try{r=await fetch('seed.json',{signal:ac.signal})}finally{clearTimeout(to)}
    if(!r.ok)return;const j=await r.json();if(!j||!Array.isArray(j.items))return;
    const seen=new Set(S.settings.seededIds||[]);const have=new Set(S.items.map(i=>i.id));let added=0;
    for(const raw of j.items){
      let it;try{it=cleanItem(raw)}catch(e){continue}
      if(seen.has(it.id)||have.has(it.id)){seen.add(it.id);continue}
      await dbPut('items',it);S.items.push(it);seen.add(it.id);added++}
    if(added||seen.size!==(S.settings.seededIds||[]).length){S.settings.seededIds=[...seen];await saveSettings()}
    if(added)toast(added+' vêtement'+(added>1?'s':'')+' ajouté'+(added>1?'s':''));
  }catch(e){}
}
/* ───────── Interrupteur d'accès (version de test) : lu seulement avec du réseau ───────── */
async function accessLocked(){
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),5000);
    let r;try{r=await fetch('acces.json?'+Date.now(),{cache:'no-store',signal:ac.signal})}finally{clearTimeout(to)}
    if(!r.ok)return false;const j=await r.json();
    if(!j||j.actif!==false)return false;
    const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:1000;background:#F3F0E8;color:#1E2A23';ov.innerHTML='<div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;font-family:system-ui,sans-serif"><div style="font:italic 700 34px Georgia,serif">Akanjo</div><p id="lockMsg" style="max-width:340px;line-height:1.45"></p><button id="lockExp" style="border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;background:#2F5D46;color:#fff">Exporter mes données</button></div>';document.body.appendChild(ov);
    document.getElementById('lockMsg').textContent=String(j.message||'Cette version de test est terminée.').slice(0,300);
    document.getElementById('lockExp').onclick=()=>exportData();
    return true;
  }catch(e){return false}
}
const OKID=/^[A-Za-z0-9_-]{1,64}$/;
const num=(v,d,a,b)=>{v=Number(v);return Number.isFinite(v)?Math.min(b,Math.max(a,v)):d};
function cleanItem(i){
  if(!i||typeof i!=='object'||!OKID.test(String(i.id)))throw 0;
  if(!CATS[i.cat])throw 0;
  const o={...i};o.id=String(i.id);o.name=String(i.name??'').slice(0,60);
  o.color=COLORS.some(c=>c.n===i.color)?i.color:'Noir';
  o.warmth=num(i.warmth,2,1,3);o.form=num(i.form,1,0,3);
  o.maxWears=Math.round(num(i.maxWears,1,1,999));o.wears=Math.round(num(i.wears,0,0,999));o.totalWears=Math.round(num(i.totalWears,0,0,99999));
  o.status=['propre','sale','lavage'].includes(i.status)?i.status:'propre';
  o.condition=['bon','abime','use'].includes(i.condition)?i.condition:'bon';
  o.washGroup=WASHG.includes(i.washGroup)?i.washGroup:WASHG[0];o.washTemp=TEMPS.includes(i.washTemp)?i.washTemp:TEMPS[0];
  o.lastWorn=i.lastWorn&&typeof i.lastWorn==='string'?i.lastWorn.slice(0,10):null;
  o.type=(TYPES[o.cat]||[]).some(t=>t.k===i.type)?i.type:null;
  o.setId=OKID.test(String(i.setId||''))?String(i.setId):null;
  o.metal=['or','argent','autre'].includes(i.metal)?i.metal:null;
  o.meteo=Array.isArray(i.meteo)?i.meteo.filter(m=>['chaud','doux','frais','froid'].includes(m)):null;
  if(o.meteo&&!o.meteo.length)o.meteo=null;
  o.occ=Array.isArray(i.occ)?i.occ.filter(x=>OCC.some(q=>q[0]===x)):null;if(o.occ&&!o.occ.length)o.occ=null;
  o.photo=typeof i.photo==='string'&&i.photo.startsWith('data:image/')?dataURLToBlob(i.photo):null;
  return o}
function cleanLog(l){
  if(!l||typeof l!=='object'||!OKID.test(String(l.id)))throw 0;
  const o={...l};o.id=String(l.id);o.date=String(l.date??'').slice(0,10);o.ts=num(l.ts,0,0,9e15);
  o.items=Array.isArray(l.items)?l.items.map(x=>({...x,id:String(x?.id??'')})).filter(x=>OKID.test(x.id)):[];
  o.photo=typeof l.photo==='string'&&l.photo.startsWith('data:image/')?dataURLToBlob(l.photo):null;
  return o}
async function mergeData(file){
  let items;
  try{
    if(file.size>150*1024*1024)throw 0;
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='akanjo'||!Array.isArray(j.items))throw 0;
    items=j.items.map(cleanItem);
    const js=j.settings&&j.settings.sets&&typeof j.settings.sets==='object'?j.settings.sets:{};
    for(const [k,v] of Object.entries(js))if(OKID.test(k)&&typeof v==='string'&&!(S.settings.sets||{})[k])S.settings.sets={...(S.settings.sets||{}),[k]:v.slice(0,30)};
  }catch(e){return toast('Fichier non valide : rien n’a été modifié')}
  await saveSettings();
  const have=new Set(S.items.map(i=>i.id));let add=0;
  try{for(const it of items){if(have.has(it.id))continue;await dbPut('items',it);S.items.push(it);have.add(it.id);add++}}
  catch(e){S.dirty=true;render();return toast('Ajout interrompu : les vêtements déjà ajoutés sont conservés')}
  S.dirty=true;render();toast(add?add+' vêtement'+(add>1?'s':'')+' ajouté'+(add>1?'s':'')+' ✓':'Rien de nouveau : tout était déjà dans ton armoire');
}
async function importData(file){
  let items,log,settings;
  try{
    if(file.size>150*1024*1024)throw 0;
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='akanjo'||!Array.isArray(j.items)||(j.log&&!Array.isArray(j.log)))throw 0;
    items=j.items.map(cleanItem);log=(j.log||[]).map(cleanLog);settings=j.settings&&typeof j.settings==='object'?j.settings:{};
  }catch(e){return toast('Fichier non valide : rien n’a été modifié')}
  if(!await askConfirm(`Remplacer tout par cette sauvegarde (${items.length} vêtements) ? Ton contenu actuel est gardé en secours.`,'Remplacer'))return;
  const snap={items:S.items,log:S.log,settings:S.settings,ts:Date.now()};
  try{
    await dbPut('meta',{key:'preImport',value:snap});
    await dbClear('items');await dbClear('log');
    for(const i of items)await dbPut('items',i);
    for(const l of log)await dbPut('log',l);
    S.items=items;S.log=log;
    S.settings={...DEFAULT_SETTINGS,...settings,maxByCat:{...DEFAULT_SETTINGS.maxByCat,...(settings.maxByCat||{})},weatherCache:S.settings.weatherCache};await saveSettings();
    S.dirty=true;render();toast('Sauvegarde restaurée ✓');
  }catch(e){
    try{await dbClear('items');await dbClear('log');for(const i of snap.items)await dbPut('items',i);for(const l of snap.log)await dbPut('log',l);S.items=snap.items;S.log=snap.log;S.settings=snap.settings;render()}catch(_){}
    toast('Import interrompu : ton contenu d’avant est remis')}
}

/* ───────── Événements ───────── */
const H={
  tab:a=>{S.tab=a.dataset.t;render();scrollTo(0,0)},
  closeSheet:()=>closeSheet(),
  addItem:()=>itemSheet(null),
  editItem:a=>itemSheet(S.items.find(i=>i.id===a.dataset.id)),
  validate:a=>validateOutfit(+a.dataset.i),
  undo:()=>undoToday(),
  more:()=>{const n=S.proposals.length;S.page++;if(S.page*4>=n){S.page=0;S.seed++;S.dirty=true}render()},
  jacket:()=>{const m=currentMode();const cur=S.useJacket===null?(m==='frais'||m==='froid'):S.useJacket;S.useJacket=!cur;S.dirty=true;S.page=0;render()},
  wmode:a=>{S.settings.weatherOverride=a.dataset.m;saveSettings();S.useJacket=null;S.dirty=true;S.page=0;render()},
  fCat:a=>{S.fCat=a.dataset.v;render()},fSt:a=>{S.fSt=a.dataset.v;render()},
  gact:a=>groupAction(a.dataset.k,a.dataset.to),
  geo:()=>{if(!navigator.geolocation)return toast('Position indisponible');navigator.geolocation.getCurrentPosition(async p=>{S.settings.lat=+p.coords.latitude.toFixed(3);S.settings.lon=+p.coords.longitude.toFixed(3);S.settings.place='Ma position';await saveSettings();await loadWeather(true);S.dirty=true;render();toast('Position mise à jour')},()=>toast('Autorisation refusée'),{timeout:10000})},
  export:()=>exportData(),
  accTog:a=>{const k=a.dataset.i+':'+a.dataset.id;if(S.accOff.has(k))S.accOff.delete(k);else S.accOff.add(k);render()},
  accOnOff:a=>{S.settings.accOn=a.dataset.v==='1';saveSettings();S.dirty=true;render()},
  profil:a=>{S.settings.profil=a.dataset.p;saveSettings();render()},
  occ:a=>{S.occ=a.dataset.o;S.dirty=true;S.page=0;render()},
  merge:()=>{const f=$('#mrgFile');f.onchange=e=>{if(e.target.files[0])mergeData(e.target.files[0]);f.value=''};f.click()},
  import:()=>{const f=$('#impFile');f.onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);f.value=''};f.click()},
  demoOn:()=>loadDemo(),
  demoOff:async()=>{for(const i of S.items.filter(i=>i.demo))await dbDel('items',i.id);S.items=S.items.filter(i=>!i.demo);S.dirty=true;render();toast('Exemples supprimés')},
  reset:async()=>{if(await askConfirm('Tout effacer : vêtements, photos et journal ?','Tout effacer')){await dbClear('items');await dbClear('log');S.items=[];S.log=[];S.dirty=true;render();toast('Tout est effacé')}},
  entryPhoto:a=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const e=S.log.find(l=>l.id===a.dataset.id);e.photo=await fileToBlob(f,1100);await dbPut('log',e);render();toast('Photo ajoutée ✓')};inp.click()}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;e.preventDefault();H[a.dataset.a]?.(a,e)});
document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset.a2;if(!k)return;
  if(k==='maxcat'){S.settings.maxByCat[t.dataset.k]=Math.max(1,+t.value||1)}
  if(k==='lowtops'){S.settings.lowTops=Math.max(0,+t.value||0)}
  await saveSettings();toast('Enregistré');
});

/* ───────── Démarrage ───────── */
(async function init(){
  try{db=await openDB()}catch(e){$('#app').innerHTML='<div class="banner warn">Le stockage du navigateur est indisponible (mode privé ?). L’app ne peut pas enregistrer tes vêtements.</div>';return}
  const m=await rq(st('meta').get('settings'));
  S.settings={...DEFAULT_SETTINGS,...(m?m.value:{}),maxByCat:{...DEFAULT_SETTINGS.maxByCat,...(m?.value?.maxByCat||{})}};
  S.items=await dbAll('items');S.log=await dbAll('log');
  await applySeed();
  if(await accessLocked())return;
  S.weather=S.settings.weatherCache&&S.settings.weatherCache.date===todayStr()?S.settings.weatherCache:null;
  render();
  navigator.storage?.persist?.();
  await loadWeather(false);S.dirty=true;render();
})();
if('serviceWorker' in navigator)addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ask=w=>{if(!w||document.getElementById('upd'))return;const b=document.createElement('div');b.id='upd';b.className='toast';b.style.pointerEvents='auto';b.innerHTML='Nouvelle version disponible <button style="margin-left:10px;border:0;border-radius:99px;padding:6px 12px;font:inherit;font-weight:700">Mettre à jour</button>';b.querySelector('button').onclick=()=>w.postMessage('SKIP_WAITING');document.body.appendChild(b)};
    if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
  }).catch(()=>{});
  let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload()});
});
